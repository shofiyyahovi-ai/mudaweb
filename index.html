<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>muda mendunia — Stop nambah followers, mulai nambah temen beneran</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #1B6DF5;
  --orange: #FD8A27;
  --yellow: #FFD842;
  --grey: #4E4E4E;
  --bg: #FAF8F4;
  --bg2: #F5F2EA;
  --bg3: #EDE9DC;
  --white: #FFFFFF;
  --border: rgba(0,0,0,0.07);
  --text: #1A1A1A;
  --text2: #4E4E4E;
  --text3: #999;
  --r: 16px;
  --r-pill: 100px;
  --px: 2rem;
}
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  overflow-x: hidden;
}
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:11px 22px; border-radius:var(--r-pill);
  font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:600;
  cursor:pointer; border:none; transition:all .2s; text-decoration:none;
}
.btn-blue { background:var(--blue); color:#fff; box-shadow:0 3px 14px rgba(27,109,245,.22); }
.btn-blue:hover { background:#1560E0; transform:translateY(-1px); }
.btn-ghost { background:transparent; color:var(--text2); border:1.5px solid var(--border); }
.btn-ghost:hover { background:var(--bg2); color:var(--text); }

/* NAV */
nav {
  position:fixed; top:0; left:0; right:0; z-index:50;
  padding:.9rem var(--px); display:flex; align-items:center; justify-content:space-between;
  background:rgba(250,248,244,.88); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav-logo img { height:32px; display:block; }
.nav-right { display:flex; gap:.75rem; align-items:center; }
.nav-link { font-size:13px; font-weight:600; color:var(--text2); text-decoration:none; padding:6px 12px; border-radius:var(--r-pill); transition:all .18s; }
.nav-link:hover { color:var(--blue); background:rgba(27,109,245,.06); }

/* HERO */
.hero {
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:7rem var(--px) 4rem; text-align:center; position:relative; overflow:hidden;
}
.hero::before {
  content:''; position:absolute; width:700px; height:700px;
  background: radial-gradient(circle, rgba(27,109,245,.07) 0%, transparent 65%);
  top:-200px; right:-250px; pointer-events:none;
}
.hero::after {
  content:''; position:absolute; width:500px; height:500px;
  background: radial-gradient(circle, rgba(253,138,39,.06) 0%, transparent 65%);
  bottom:-150px; left:-150px; pointer-events:none;
}
.hero-eyebrow {
  display:inline-flex; align-items:center; gap:7px;
  background:var(--white); border:1px solid var(--border);
  padding:6px 16px; border-radius:var(--r-pill); font-size:12px; font-weight:600;
  color:var(--text2); margin-bottom:1.75rem;
  box-shadow:0 1px 8px rgba(0,0,0,.05);
}
.hero-eyebrow span { color:var(--blue); }
.hero-title {
  font-size: clamp(2.8rem, 7vw, 5rem);
  font-weight:800; line-height:1.06; letter-spacing:-.03em;
  margin-bottom:1.25rem; max-width:640px;
}
.hero-title em { font-style:normal; color:var(--blue); }
.hero-title .yel { color:var(--orange); }
.hero-sub {
  font-size:1.05rem; color:var(--text2); font-weight:400; max-width:460px;
  margin:0 auto 2.5rem; line-height:1.8;
}
.hero-cta { display:flex; gap:.85rem; flex-wrap:wrap; justify-content:center; align-items:center; margin-bottom:2rem; }
.hero-features {
  display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center;
  padding-top:1.75rem; border-top:1px solid var(--border); max-width:560px;
}
.feat-tag {
  background:var(--white); border:1px solid var(--border);
  padding:6px 14px; border-radius:var(--r-pill); font-size:12px; color:var(--text2);
  display:flex; align-items:center; gap:6px;
}

/* STATS */
.stats-row {
  display:flex; gap:2rem; justify-content:center; flex-wrap:wrap;
  padding:3rem var(--px); border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  background:var(--white);
}
.stat { text-align:center; }
.stat-num { font-size:2rem; font-weight:800; letter-spacing:-.03em; color:var(--blue); }
.stat-lbl { font-size:12px; color:var(--text3); margin-top:2px; }

/* HOW IT WORKS */
.section { padding:5rem var(--px); max-width:860px; margin:0 auto; }
.sec-eyebrow { font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--blue); margin-bottom:.6rem; }
.sec-title { font-size:2rem; font-weight:800; letter-spacing:-.03em; margin-bottom:.5rem; }
.sec-sub { color:var(--text2); font-size:.95rem; max-width:480px; line-height:1.75; }
.steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1.5rem; margin-top:3rem; }
.step-card {
  background:var(--white); border:1px solid var(--border); border-radius:var(--r);
  padding:1.5rem; position:relative; overflow:hidden;
}
.step-card::before {
  content:attr(data-n);
  position:absolute; top:-10px; right:12px;
  font-size:4rem; font-weight:800; color:rgba(27,109,245,.06); line-height:1;
}
.step-icon { font-size:1.75rem; margin-bottom:.85rem; }
.step-name { font-size:14.5px; font-weight:700; margin-bottom:4px; }
.step-desc { font-size:12.5px; color:var(--text2); line-height:1.6; }

/* FEATURES */
.features { padding:5rem var(--px); background:var(--bg2); }
.features-inner { max-width:860px; margin:0 auto; }
.feat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; margin-top:3rem; }
.feat-card {
  background:var(--white); border:1px solid var(--border); border-radius:var(--r);
  padding:1.35rem;
}
.feat-card.feat-card--hero {
  background:linear-gradient(135deg, #1B6DF5 0%, #1560E0 100%);
  border-color:#1B6DF5;
  grid-column: span 2;
  display:flex; gap:1.25rem; align-items:flex-start;
  color:#fff;
}
.feat-card.feat-card--hero .feat-card-icon { font-size:2rem; margin-bottom:0; }
.feat-card.feat-card--hero .feat-card-name { font-size:16px; color:#fff; }
.feat-card.feat-card--hero .feat-card-desc { font-size:13px; color:rgba(255,255,255,.85); }
@media (max-width:768px) {
  .feat-card.feat-card--hero { grid-column: span 1; flex-direction:column; }
}
.feat-card-icon { font-size:1.5rem; margin-bottom:.75rem; }
.feat-card-name { font-size:14px; font-weight:700; margin-bottom:4px; }
.feat-card-desc { font-size:12.5px; color:var(--text2); line-height:1.6; }

/* CTA BOTTOM */
.cta-bottom {
  padding:6rem var(--px); text-align:center;
  background:linear-gradient(135deg, #EBF2FF 0%, #FFF8EE 100%);
}
.cta-bottom-title { font-size:2.4rem; font-weight:800; letter-spacing:-.03em; margin-bottom:.85rem; max-width:480px; margin-left:auto; margin-right:auto; }
.cta-bottom-sub { color:var(--text2); font-size:.95rem; margin-bottom:2rem; }

/* FOOTER */
footer {
  padding:2rem var(--px); text-align:center; border-top:1px solid var(--border);
  font-size:12px; color:var(--text3);
}
footer img { height:22px; margin-bottom:.65rem; display:block; margin-left:auto; margin-right:auto; }

/* ==============================
   MICRO ANIMATIONS
   ============================== */

/* Fade-in up — untuk elemen masuk saat scroll */
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(24px); }
  to   { opacity:1; transform:translateY(0); }
}

/* Pulse ringan untuk badge eyebrow */
@keyframes softPulse {
  0%,100% { box-shadow: 0 1px 8px rgba(0,0,0,.05); }
  50%      { box-shadow: 0 2px 16px rgba(27,109,245,.18); }
}

/* Float naik-turun untuk hero emoji / dekorasi */
@keyframes float {
  0%,100% { transform:translateY(0); }
  50%      { transform:translateY(-6px); }
}

/* Shimmer untuk stat numbers */
@keyframes shimmer {
  0%   { color: var(--blue); }
  50%  { color: #4d9fff; }
  100% { color: var(--blue); }
}

/* Slide-in dari kiri untuk step cards */
@keyframes slideInLeft {
  from { opacity:0; transform:translateX(-20px); }
  to   { opacity:1; transform:translateX(0); }
}

/* ---- Terapkan animasi ---- */

/* Hero eyebrow badge */
.hero-eyebrow {
  animation: softPulse 3s ease-in-out infinite;
}

/* Hero title muncul */
.hero-title {
  animation: fadeInUp .7s ease both;
  animation-delay: .1s;
}

/* Hero subtitle */
.hero-sub {
  animation: fadeInUp .7s ease both;
  animation-delay: .25s;
}

/* Hero CTA */
.hero-cta {
  animation: fadeInUp .7s ease both;
  animation-delay: .4s;
}

/* Hero feature tags */
.hero-features {
  animation: fadeInUp .7s ease both;
  animation-delay: .55s;
}

/* Stat numbers */
.stat-num {
  animation: shimmer 3.5s ease-in-out infinite;
}

/* Step cards dengan delay bertingkat */
.step-card {
  animation: fadeInUp .6s ease both;
  transition: transform .22s ease, box-shadow .22s ease;
}
.step-card:nth-child(1) { animation-delay:.1s; }
.step-card:nth-child(2) { animation-delay:.22s; }
.step-card:nth-child(3) { animation-delay:.34s; }
.step-card:nth-child(4) { animation-delay:.46s; }

.step-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,.10);
}

/* Feature cards hover */
.feat-card {
  transition: transform .2s ease, box-shadow .2s ease;
}
.feat-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(0,0,0,.09);
}

/* Feature tag hover */
.feat-tag {
  transition: background .18s, color .18s, transform .18s;
}
.feat-tag:hover {
  background: var(--blue);
  color: #fff;
  transform: scale(1.05);
}

/* Button ripple feel */
.btn {
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background .2s;
}
.btn:hover::after {
  background: rgba(255,255,255,.08);
}

/* Nav link hover underline */
.nav-link {
  position: relative;
}
.nav-link::after {
  content: '';
  position: absolute;
  bottom: 2px; left: 12px; right: 12px;
  height: 2px;
  background: var(--blue);
  border-radius: 2px;
  transform: scaleX(0);
  transition: transform .2s ease;
}
.nav-link:hover::after {
  transform: scaleX(1);
}

/* CTA bottom section */
.cta-bottom-title {
  animation: fadeInUp .7s ease both;
}

/* ==============================
   MOBILE RESPONSIVE
   ============================== */

/* Tablet — max 768px */
@media (max-width: 768px) {
  :root { --px: 2rem; }

  nav {
    padding-top: .75rem;
    padding-bottom: .75rem;
  }
  .nav-logo img { height: 26px; }
  .nav-link { display: none; }

  .hero {
    padding-top: 6rem;
    padding-bottom: 3rem;
  }
  .hero-title {
    font-size: clamp(2rem, 9vw, 2.8rem);
    letter-spacing: -.02em;
  }
  .hero-sub {
    font-size: .95rem;
  }
  .hero-cta {
    flex-direction: column;
    gap: .65rem;
    width: 100%;
  }
  .hero-cta .btn {
    width: 100%;
    justify-content: center;
  }
  .hero-features {
    gap: .45rem;
  }
  .feat-tag {
    font-size: 11px;
    padding: 5px 12px;
  }

  .stats-row {
    padding-top: 2rem;
    padding-bottom: 2rem;
    gap: 1.25rem;
  }
  .stat-num { font-size: 1.6rem; }

  .section {
    padding-top: 3.5rem;
    padding-bottom: 3.5rem;
  }
  .sec-title { font-size: 1.6rem; }

  .steps {
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .features {
    padding-top: 3.5rem;
    padding-bottom: 3.5rem;
  }
  .feat-grid {
    grid-template-columns: 1fr 1fr;
    gap: .85rem;
  }
  .feat-card {
    padding: 1.1rem;
  }
  .feat-card-icon { font-size: 1.3rem; }
  .feat-card-name { font-size: 13px; }
  .feat-card-desc { font-size: 11.5px; }

  .cta-bottom {
    padding-top: 4rem;
    padding-bottom: 4rem;
  }
  .cta-bottom-title {
    font-size: 1.75rem;
  }
  .cta-bottom .btn {
    width: 100%;
    justify-content: center;
  }
}

/* Small mobile — max 480px */
@media (max-width: 480px) {
  :root { --px: 2rem; }

  .nav-logo img { height: 22px; }

  .hero-title {
    font-size: clamp(1.55rem, 8vw, 2.2rem);
  }

  .feat-grid {
    grid-template-columns: 1fr;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    text-align: center;
  }
}
</style>
</head>
